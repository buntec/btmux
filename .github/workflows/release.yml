name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A failed Windows build doesn't hold back the other releases.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            experimental: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: .exe
            experimental: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The other targets check the same files; `python3` may be a Store stub here.
      - name: Verify release version
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          def cargo_version(path):
              match = re.search(r'^version = "([^"]+)"', pathlib.Path(path).read_text(), re.MULTILINE)
              assert match, f"no version in {path}"
              return match.group(1)

          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert cargo_version('Cargo.toml') == version
          assert cargo_version('desktop/src-tauri/Cargo.toml') == version
          assert json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version'] == version
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/btmux${{ matrix.exe }} btmux-${{ matrix.target }}${{ matrix.exe }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: btmux-${{ matrix.target }}
          path: btmux-${{ matrix.target }}${{ matrix.exe }}
          if-no-files-found: error

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Prepare desktop sidecar
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp btmux-${{ matrix.target }}${{ matrix.exe }} desktop/src-tauri/binaries/btmux-${{ matrix.target }}${{ matrix.exe }}

      - name: Build macOS desktop app
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run build -- --target ${{ matrix.target }} --bundles app

      - name: Build Linux desktop package
        if: runner.os == 'Linux'
        working-directory: desktop
        run: bun run build -- --target ${{ matrix.target }} --bundles deb

      - name: Build Windows desktop installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: bun run build -- --target ${{ matrix.target }} --bundles nsis

      - name: Package macOS desktop app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/btmux.app \
            btmux-desktop-${{ matrix.target }}.zip

      - name: Package Linux desktop app
        if: runner.os == 'Linux'
        run: |
          debs=(desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test -f "${debs[0]}"
          test "${#debs[@]}" -eq 1
          cp "${debs[0]}" btmux-desktop-${{ matrix.target }}.deb

      - name: Package Windows desktop installer
        if: runner.os == 'Windows'
        run: |
          installers=(desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
          test -f "${installers[0]}"
          test "${#installers[@]}" -eq 1
          cp "${installers[0]}" btmux-desktop-${{ matrix.target }}-setup.exe

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: btmux-desktop-${{ matrix.target }}
          path: btmux-desktop-${{ matrix.target }}*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: btmux-*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: buntec/homebrew-btmux
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-btmux

      - name: Update formula and cask
        run: ./scripts/update-homebrew-tap.sh homebrew-btmux "${{ github.ref_name }}"

      - name: Push tap
        working-directory: homebrew-btmux
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula Casks
          git diff --cached --quiet || git commit -m "btmux ${GITHUB_REF_NAME#v}"
          git push

  nix:
    name: Update Nix package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: cachix/install-nix-action@v31

      - name: Update Nix package
        run: ./scripts/update-nix-package.sh "${{ github.ref_name }}"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix
          git diff --cached --quiet || git commit -m "Update Nix package to ${GITHUB_REF_NAME#v}"
          git pull --rebase origin main
          git push origin HEAD:main
