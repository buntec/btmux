[package]
name = "btmux"
version = "0.0.174"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["cors", "fs"] }
rust-embed = { version = "8", features = ["axum", "compression"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures-util = "0.3"
libc = "0.2"
toml = "1.1"
notify = "8"
open = "5"
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
nucleo = "0.5"
base64 = "0.23"
dirs = "7"
git2 = { version = "0.21", default-features = false }
trash = "5"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
strip-ansi-escapes = "0.2.1"
schemars = "1.2.3"
sysinfo = "0.39"
vt100 = "0.18"
regex = "1"
netstat2 = "0.11.2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }

[profile.release]
strip = true
