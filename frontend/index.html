<!DOCTYPE html>
<!-- Inline predictions are IME compositions, which swallow Enter in search fields;
     spellcheck also gates macOS autocorrection and capitalization. -->
<html lang="en" writingsuggestions="false" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <!-- Android resizes the layout for the on-screen keyboard; iOS needs useVisualViewport.
         viewport-fit=cover reports the safe-area insets, which the shell pads. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="btmux" />
    <!-- Behind the auth boundary: fetch it with the session cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>btmux</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
