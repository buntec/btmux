<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Stacked pen lines that calm down at the edges and break out into waves
// around a drifting center.
var VERT = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
var FRAG = [
'precision highp float;',
'uniform vec2 res;uniform float t;uniform float c;uniform float ph;uniform float sw;uniform float lw;',
'const float UNIT=0.012;',
'float flow(float x,float s){return sin(x*0.03+s)+0.5*sin(x*0.15+s*2.3);}',
'float lineY(float x,float base,float s,float center,float spread){',
'  float b=exp(-pow((x-center)/spread,4.0));',
'  return base+flow(x,s)*17.0*b+sin(x*0.05+s)*2.0;',
'}',
'void main(){',
'  vec2 p=(gl_FragCoord.xy-0.5*res)/res.y;',
'  float x=p.x/UNIT, y=p.y/UNIT;',
'  float px=1.0/res.y/UNIT;',
'  float w=max(0.12*lw,px);',
'  float fade=min(1.0,0.12*lw/px);',
'  float keep=1.0;',
'  for(int k=0;k<3;k++){',
'    float fk=float(k);',
'    float stave=(fk-1.0)*(6.0*sw+9.0);',
'    float center=c+(fk-1.0)*14.0*sin(t*0.07+fk*2.0);',
'    float spread=20.0+6.0*sin(t*0.13+fk*1.7);',
'    for(int i=2;i<9;i++){',
'      float fi=float(i);',
'      float s=fi*0.3+fk*1.9+ph+t*0.35;',
'      float base=stave+(3.0-fi)*sw;',
'      float ly=lineY(x,base,s,center,spread);',
'      float slope=(lineY(x+0.4,base,s,center,spread)-ly)/0.4;',
'      float d=abs(y-ly)/sqrt(1.0+slope*slope);',
'      keep*=1.0-0.37*fade*(1.0-smoothstep(w,w+1.2*px,d));',
'    }',
'  }',
'  float ink=1.0-keep;',
'  vec3 col=vec3(0.02,0.025,0.04)+ink*vec3(0.85,0.9,1.0);',
'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl', { antialias: false, alpha: false });
function compile(type, src) {
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
var prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
var uRes = gl.getUniformLocation(prog, 'res'), uT = gl.getUniformLocation(prog, 't'),
    uC = gl.getUniformLocation(prog, 'c'), uPh = gl.getUniformLocation(prog, 'ph'), uSw = gl.getUniformLocation(prog, 'sw'), uLw = gl.getUniformLocation(prog, 'lw');

var seed = new URLSearchParams(location.search).get('seed') || 'btmux', hash = 2166136261;
for (var i = 0; i < seed.length; i++) { hash ^= seed.charCodeAt(i); hash = Math.imul(hash, 16777619); }
var phase = (hash >>> 0) / 4294967296 * 100;

var animated = true, speed = 1, maxFps = 30, time = 0, last = 0, rafId = 0;
var pointerX = null, center = 9, staveWidth = 1, lineWidth = 1;

function resize() {
  var w = Math.max(1, Math.round(innerWidth * devicePixelRatio)), h = Math.max(1, Math.round(innerHeight * devicePixelRatio));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
}
function draw() {
  resize();
  var aspect = canvas.width / canvas.height;
  // Breakout follows the pointer when active, else wanders on its own.
  var target = pointerX === null ? 9 + 35 * Math.sin(time * 0.05) : (pointerX - 0.5) * aspect / 0.012;
  center += (target - center) * 0.05;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uT, time); gl.uniform1f(uC, center); gl.uniform1f(uPh, phase); gl.uniform1f(uSw, staveWidth); gl.uniform1f(uLw, lineWidth);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function frame(now) {
  rafId = 0;
  if (!animated) return;
  if (now - last >= 1000 / maxFps - 1) {
    time += Math.min(0.1, (now - last) / 1000) * speed;
    last = now; draw();
  }
  rafId = requestAnimationFrame(frame);
}
function sync() {
  if (animated && !rafId) { last = performance.now(); rafId = requestAnimationFrame(frame); }
  else if (!animated) draw();
}
addEventListener('resize', draw);
addEventListener('message', function (e) {
  var d = e.data; if (!d) return;
  if (d.type === 'btmux-runtime') {
    animated = !!d.animated; speed = d.speed; maxFps = Math.max(1, d.maxFps || 30); sync();
  } else if (d.type === 'param') {
    if (d.name === 'STAVE_WIDTH') staveWidth = d.value;
    else if (d.name === 'LINE_WIDTH') lineWidth = d.value;
    if (!animated) draw();
  } else if (d.type === 'btmux-pointer') {
    pointerX = d.active ? d.x : null;
  }
});
draw(); sync();
</script>
</body>
</html>
