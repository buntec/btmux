id = "agy"
version = "2026.10.29.1"
min_engine_version = 1
updated_at = "2026-10-29T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
  { contains = ["run this command?", "tab amend"] },
]

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]+\s+\p{Alphabetic}+\w*ing\b']

[[rules]]
id = "background_tasks_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)·\s*[1-9][0-9]*\s+task']

# The prompt box's lower rule sits above the footer, which reads "esc to
# cancel" while working or in a dialog.
[[rules]]
id = "prompt_box_idle"
state = "idle"
priority = 80
region = "bottom_non_empty_lines(2)"
visible_idle = true
line_regex = ['^─{20,}']
not = [{ contains = ["esc to cancel"] }]
